name: MelonTools
options:
  bundleIdPrefix: dev.melontools
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  MelonTools:
    type: application
    platform: macOS
    sources:
      - path: MelonTools
        excludes:
          - "Info.plist"
          - "MelonTools.entitlements"
      - path: Resources
    info:
      path: MelonTools/Info.plist
      properties:
        CFBundleDisplayName: Melon Tools
        CFBundleName: Melon Tools
        CFBundleShortVersionString: "2.4.1"
        CFBundleVersion: "26"
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Melon Tools"
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "14.0"
        LSMultipleInstancesProhibited: true
        CFBundleLocalizations:
          - ru
          - en
        NSAppleEventsUsageDescription: "Melon Tools opens Terminal to launch isolated Codex CLI instances."
    postBuildScripts:
      - name: Embed gateway binary
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          RES="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          GATEWAY_BIN="$SRCROOT/../build/cliproxyapi"
          if [ -f "$GATEWAY_BIN" ]; then
            mkdir -p "$RES/bin"
            # Ship a compressed engine: the universal Go binary is ~139 MB,
            # the gzip blob is roughly a quarter of that. The app extracts it
            # into Application Support and verifies this digest before launch.
            gzip -9 -c "$GATEWAY_BIN" > "$RES/bin/cliproxyapi.gz"
            shasum -a 256 "$GATEWAY_BIN" | awk '{print $1}' > "$RES/bin/cliproxyapi.sha256"
            rm -f "$RES/bin/cliproxyapi"
            echo "embedded compressed gateway -> $RES/bin/cliproxyapi.gz"
          else
            echo "warning: gateway binary missing at $GATEWAY_BIN (build it with build.sh)"
          fi
    scheme:
      testTargets:
        - MelonToolsTests
    settings:
      base:
        MARKETING_VERSION: "2.4.1"
        CURRENT_PROJECT_VERSION: "26"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: MelonTools/MelonTools.entitlements
      configs:
        # Keep the installed Release app and a Debug/test host from fighting
        # over LSMultipleInstancesProhibited: distinct bundle ids allow
        # `xcodebuild test` while Melon Tools is open.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.melontools.app.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.melontools.app

  MelonToolsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MelonToolsTests
    dependencies:
      - target: MelonTools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.melontools.tests
        GENERATE_INFOPLIST_FILE: "YES"
