name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app and UI syntax
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned XcodeGen
        run: ./.github/scripts/install-xcodegen.sh

      - name: Generate the Xcode project
        working-directory: MacOS/app
        run: xcodegen generate

      - name: Run macOS tests (unsigned)
        working-directory: MacOS
        run: |
          set -o pipefail
          xcodebuild \
            -project app/MelonTools.xcodeproj \
            -scheme MelonTools \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/MelonToolsDerived" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Check localization keys
        run: python3 MacOS/scripts/l10n_lint.py

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Syntax-check every UI and composer script
        run: |
          set -euo pipefail
          for file in Windows/app/ui/*.js Windows/app/resources/composer-chips.js MacOS/app/Resources/composer-chips.js shared/composer-chips.js; do
            node --check "$file"
          done
          ./scripts/sync-composer.sh --check
          node Windows/app/tools/ui-static-check.js

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          for file in MacOS/build.sh Windows/build-windows.sh packaging/sign-macos.sh MacOS/scripts/fetch-sources.sh; do
            bash -n "$file"
          done
          if command -v shellcheck >/dev/null 2>&1; then shellcheck -S warning MacOS/build.sh Windows/build-windows.sh packaging/sign-macos.sh; fi

  package-macos:
    name: Package macOS DMG (no publish)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned XcodeGen
        run: ./.github/scripts/install-xcodegen.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false

      - name: Fetch the pinned gateway source
        run: ./MacOS/scripts/fetch-sources.sh

      - name: Build the app and DMG (unsigned)
        run: ./MacOS/build.sh

      - name: Upload the DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-package
          path: MacOS/build/MelonTools-*.dmg
          if-no-files-found: error

  windows:
    name: Windows app tests
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Windows/app/src-tauri
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: Windows/app/src-tauri -> target

      # The tests do not need the gateway engine: the checked-in compressed
      # engine is an embedded resource and is not exercised by cargo test.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked -- -D warnings

      - name: Run cargo tests
        run: cargo test --locked

  package-windows:
    name: Package Windows installer (no publish)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Windows/app/src-tauri
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1

      - name: Build the executable
        run: cargo build --release --locked

      - name: Build the NSIS installer
        working-directory: Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path app/src-tauri/Cargo.toml -Pattern '^version = "([0-9.]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item app/src-tauri/target/release/melontools.exe "dist/MelonTools-$version-win-x64-portable.exe"
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis --version=3.11 -y --no-progress
            $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          }
          $source = (Resolve-Path "dist/MelonTools-$version-win-x64-portable.exe").Path
          & $makensis /V2 "/DVERSION=$version" "/DSOURCE_EXE=$source" "installer/MelonTools.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          if (-not (Test-Path "dist/MelonTools-$version-setup.exe")) { throw "installer missing" }

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package
          path: Windows/dist/MelonTools-*-setup.exe
          if-no-files-found: error

  engine-repro:
    name: Reproduce the Windows engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false

      - name: Rebuild and compare the embedded engine
        run: ./Windows/scripts/build-engine.sh

  docs-lint:
    name: Docs and manifest lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.2

      - name: Validate YAML, JSON, versions, and documentation links
        run: python .github/scripts/docs_lint.py

      - name: Verify distribution manifests against checksums
        run: python scripts/verify_release_checksums.py

      - name: Verify the embedded Windows engine
        run: python Windows/scripts/verify-engine.py

      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
