name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app and UI syntax
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned XcodeGen
        run: ./.github/scripts/install-xcodegen.sh

      # REL-01: app/Resources/runtime is gitignored and project.yml declares it
      # as a folder source. Fetching it in build.sh is too late for the first
      # xcodegen run, so populate and verify it here first.
      - name: Fetch and verify the pinned llama.cpp runtime
        run: ./MacOS/scripts/fetch-runtime.sh

      - name: Smoke-test a clean checkout
        run: RUNTIME_CACHE="$PWD/MacOS/build/runtime-cache" ./MacOS/scripts/test-clean-checkout.sh

      - name: Generate the Xcode project
        working-directory: MacOS/app
        run: xcodegen generate

      - name: Run macOS tests (unsigned)
        working-directory: MacOS
        run: |
          set -o pipefail
          xcodebuild \
            -project app/MelonTools.xcodeproj \
            -scheme MelonTools \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/MelonToolsDerived" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Check localization keys
        run: python3 MacOS/scripts/l10n_lint.py

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Syntax-check every UI and composer script
        run: |
          set -euo pipefail
          for file in Windows/app/ui/*.js Windows/app/resources/composer-chips.js MacOS/app/Resources/composer-chips.js shared/composer-chips.js; do
            node --check "$file"
          done
          ./scripts/sync-composer.sh --check
          node Windows/app/tools/ui-static-check.js

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          for file in MacOS/build.sh Windows/build-windows.sh packaging/sign-macos.sh \
                      MacOS/scripts/fetch-sources.sh MacOS/scripts/fetch-runtime.sh \
                      MacOS/scripts/test-fetch-runtime.sh \
                      MacOS/scripts/test-clean-checkout.sh \
                      MacOS/scripts/native-acceptance.sh; do
            bash -n "$file"
          done
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning MacOS/build.sh Windows/build-windows.sh \
              packaging/sign-macos.sh MacOS/scripts/fetch-runtime.sh \
              MacOS/scripts/test-fetch-runtime.sh \
              MacOS/scripts/native-acceptance.sh \
              MacOS/scripts/test-clean-checkout.sh
          fi

  package-macos:
    name: Package macOS DMG (no publish)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned XcodeGen
        run: ./.github/scripts/install-xcodegen.sh

      - name: Fetch and verify the pinned llama.cpp runtime
        run: ./MacOS/scripts/fetch-runtime.sh

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"
          cache: false

      - name: Fetch the pinned gateway source
        run: ./MacOS/scripts/fetch-sources.sh

      - name: Build the app and DMG (unsigned)
        run: ./MacOS/build.sh

      - name: Native acceptance (unsigned)
        run: |
          set -euo pipefail
          DMG="$(find MacOS/build -maxdepth 1 -name 'MelonTools-*.dmg' -print -quit)"
          test -n "$DMG"
          ./MacOS/scripts/native-acceptance.sh --dmg "$DMG" \
            --report MacOS/build/native-acceptance.txt

      - name: Upload the DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-package
          path: |
            MacOS/build/MelonTools-*.dmg
            MacOS/build/native-acceptance.txt
          if-no-files-found: error

  windows:
    name: Windows app tests
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Windows/app/src-tauri
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: Windows/app/src-tauri -> target

      # The tests do not need the gateway engine: the checked-in compressed
      # engine is an embedded resource and is not exercised by cargo test.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run cargo tests
        run: cargo test --locked

  package-windows:
    name: Package Windows installer (no publish)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Windows/app/src-tauri
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1

      - name: Build the executable
        run: cargo build --release --locked

      - name: Build the NSIS installer
        working-directory: Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path app/src-tauri/Cargo.toml -Pattern '^version = "([0-9.]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item app/src-tauri/target/release/melontools.exe "dist/MelonTools-$version-win-x64-portable.exe"
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis --version=3.11 -y --no-progress
            $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          }
          $source = (Resolve-Path "dist/MelonTools-$version-win-x64-portable.exe").Path
          & $makensis /V2 "/DVERSION=$version" "/DSOURCE_EXE=$source" "installer/MelonTools.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          if (-not (Test-Path "dist/MelonTools-$version-setup.exe")) { throw "installer missing" }

      - name: Checksums and native artifact acceptance
        working-directory: Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path app/src-tauri/Cargo.toml -Pattern '^version = "([0-9.]+)"').Matches[0].Groups[1].Value
          foreach ($name in @("MelonTools-$version-win-x64-portable.exe", "MelonTools-$version-setup.exe")) {
            $path = Join-Path "dist" $name
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -Path "$path.sha256" -Encoding ascii -NoNewline
          }
          & ../packaging/verify-windows-artifacts.ps1 `
            -Dist dist -Version $version -Report dist/windows-acceptance.txt
          if ($LASTEXITCODE -ne 0) { throw "Windows artifact acceptance failed" }

      - name: Upload the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package
          path: |
            Windows/dist/MelonTools-*-setup.exe
            Windows/dist/MelonTools-*-setup.exe.sha256
            Windows/dist/MelonTools-*-win-x64-portable.exe
            Windows/dist/MelonTools-*-win-x64-portable.exe.sha256
            Windows/dist/windows-acceptance.txt
          if-no-files-found: error

  engine-repro:
    name: Reproduce the Windows engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"
          cache: false

      - name: Rebuild and compare the embedded engine
        run: ./Windows/scripts/build-engine.sh

  docs-lint:
    name: Docs and manifest lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.2

      - name: Validate YAML, JSON, versions, and documentation links
        run: python .github/scripts/docs_lint.py

      - name: Verify distribution manifests against checksums
        run: python scripts/verify_release_checksums.py

      - name: Release gate regression tests
        run: python scripts/test_release_checksums.py

      - name: Verify the embedded Windows engine
        run: python Windows/scripts/verify-engine.py

      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
