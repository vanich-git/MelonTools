name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (for example v2.0.3)"
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Resolve and verify the version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '/CFBundleShortVersionString:/{print $2; exit}' MacOS/app/project.yml)"
          TAG="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the project version '$VERSION'." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python for the release metadata gate
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the metadata lint dependency
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.2

      # Build phase. The committed Homebrew/winget manifests still describe
      # the last published release on purpose: code signing and notarization
      # timestamp the DMG during this job, so the real hashes cannot exist
      # before it. This gate checks that the tag's sources and release notes
      # agree; the strict promotion gate runs in release-promote.yml after the
      # draft with its generated metadata has been reviewed.
      # Backfills via workflow_dispatch skip it like the rest of the tag gates.
      - name: Release source version gate
        if: github.event_name == 'push'
        run: python3 .github/scripts/docs_lint.py --release "${{ steps.version.outputs.version }}" --preflight

      - name: Check macOS signing secrets
        id: signing
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_CERT_P12" ] && [ -n "$APPLE_CERT_PASSWORD" ] \
             && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing secrets are missing; the DMG will be ad-hoc signed."
          fi

      - name: Install pinned XcodeGen
        run: ./.github/scripts/install-xcodegen.sh

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # The pinned CLIProxyAPI source declares `go 1.26.0`; use the patch
          # level from MacOS/README.md and the engine provenance file.
          go-version: "1.26.10"
          cache: false

      - name: Fetch the pinned gateway source
        run: ./MacOS/scripts/fetch-sources.sh

      # REL-01: fetch the gitignored runtime before the first XcodeGen run.
      # build.sh also fetches it, but that happens after project generation.
      - name: Fetch and verify the pinned llama.cpp runtime
        run: ./MacOS/scripts/fetch-runtime.sh

      - name: Smoke-test a clean checkout
        run: RUNTIME_CACHE="$PWD/MacOS/build/runtime-cache" ./MacOS/scripts/test-clean-checkout.sh

      - name: Generate the Xcode project
        working-directory: MacOS/app
        run: xcodegen generate

      # A release must not publish a build that the CI gate would reject:
      # 5.0.0 shipped with a UI command missing from the Tauri bridge whitelist
      # because this job only ran the tests.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Validate localization and UI scripts
        run: |
          set -euo pipefail
          python3 MacOS/scripts/l10n_lint.py
          for file in Windows/app/ui/*.js Windows/app/resources/composer-chips.js MacOS/app/Resources/composer-chips.js shared/composer-chips.js; do
            node --check "$file"
          done
          ./scripts/sync-composer.sh --check
          node Windows/app/tools/ui-static-check.js

      - name: Run macOS tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project MacOS/app/MelonTools.xcodeproj \
            -scheme MelonTools \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/MelonToolsTests" \
            CODE_SIGNING_ALLOWED=NO test

      - name: Build the app and DMG
        working-directory: MacOS
        run: ./build.sh

      # Signing is optional. The job must not fail when the repository has no
      # Apple secrets yet: it then publishes the usual ad-hoc signed DMG.
      - name: Import the Apple signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/apple-cert.p12"
          KEYCHAIN="$RUNNER_TEMP/melontools-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERT_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$CERT"

      - name: Sign and notarize the DMG
        id: sign
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          APP="$HOME/Library/Developer/MelonTools/Build/Products/Release/MelonTools.app"
          DMG="MacOS/build/MelonTools-${{ steps.version.outputs.version }}.dmg"
          ./packaging/sign-macos.sh "$APP" "$DMG"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Generate the SHA-256 checksum
        working-directory: MacOS
        run: |
          set -euo pipefail
          DMG="build/MelonTools-${{ steps.version.outputs.version }}.dmg"
          test -f "$DMG"
          # Keep the bare filename so `shasum -c` works in a download folder.
          (cd build && shasum -a 256 "MelonTools-${{ steps.version.outputs.version }}.dmg" \
            > "MelonTools-${{ steps.version.outputs.version }}.dmg.sha256")
          cat "$DMG.sha256"

      - name: Native acceptance (unsigned or signed)
        working-directory: MacOS
        run: |
          set -euo pipefail
          DMG="build/MelonTools-${{ steps.version.outputs.version }}.dmg"
          ARGS=(--dmg "$DMG" --sha256 "$DMG.sha256" --report build/native-acceptance.txt)
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            ARGS+=(--require-signed)
          fi
          ./scripts/native-acceptance.sh "${ARGS[@]}"

      - name: Upload the DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg
          path: |
            MacOS/build/MelonTools-*.dmg
            MacOS/build/MelonTools-*.dmg.sha256
            MacOS/build/native-acceptance.txt
          if-no-files-found: error

  windows:
    name: Windows executable
    runs-on: windows-2025
    timeout-minutes: 75
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Check Windows signing secrets
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERT_PFX_BASE64 -and $env:WINDOWS_CERT_PASSWORD) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "::warning::Windows signing secrets are missing; the executable will be unsigned."
          }

      - name: Resolve and verify the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^version = "([^"]+)"$/\1/p' Windows/app/src-tauri/Cargo.toml | head -1)
          TAG="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the crate version '$VERSION'." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: Windows/app/src-tauri -> target

      # Windows/build-windows.sh is a macOS cross-compile helper (cargo-xwin).
      # On windows-latest the same sources build natively with cargo; the
      # checked-in compressed gateway engine is embedded into the executable.
      - name: Run Windows tests
        working-directory: Windows/app/src-tauri
        shell: bash
        run: cargo test --locked

      - name: Build the executable
        working-directory: Windows/app/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          touch src/main.rs
          cargo build --release --locked
          mkdir -p ../../dist
          cp target/release/melontools.exe \
            "../../dist/MelonTools-${{ steps.version.outputs.version }}-win-x64-portable.exe"
          cp "../../dist/MelonTools-${{ steps.version.outputs.version }}-win-x64-portable.exe" \
            "../../dist/MelonTools-${{ steps.version.outputs.version }}-win-x64.exe"

      - name: Sign the executable
        id: sign
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ runner.temp }}\melontools-cert.pfx
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          $ErrorActionPreference = "Stop"
          try {
            $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
            [IO.File]::WriteAllBytes($env:WINDOWS_CERT_PFX, $bytes)
            $exe = "Windows/dist/MelonTools-${{ steps.version.outputs.version }}-win-x64-portable.exe"
            ./packaging/sign-windows.ps1 -File $exe -Require
            if ($LASTEXITCODE -ne 0) { throw "sign-windows.ps1 failed" }
            $legacy = "Windows/dist/MelonTools-${{ steps.version.outputs.version }}-win-x64.exe"
            if (Test-Path $legacy) {
              ./packaging/sign-windows.ps1 -File $legacy -Require
              if ($LASTEXITCODE -ne 0) { throw "sign-windows.ps1 failed for legacy alias" }
            }
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } finally {
            Remove-Item $env:WINDOWS_CERT_PFX -Force -ErrorAction SilentlyContinue
          }

      - name: Build the Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          # NSIS version resources are four numeric fields, so a prerelease tag
          # such as 6.0.0-rc.1 uses its numeric core (6.0.0) there. The display
          # name, output file and uninstall entry keep the full version.
          $numericVersion = $version.Split('-')[0]
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis --version=3.11 -y --no-progress
            $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) { throw "makensis not found" }
          $source = "Windows/dist/MelonTools-$version-win-x64-portable.exe"
          if (-not (Test-Path $source)) { Get-ChildItem Windows -Recurse -Filter "*portable*" | Format-Table FullName; throw "portable exe missing before makensis" }
          $source = (Resolve-Path $source).Path
          Push-Location Windows
          & $makensis /V2 "/DVERSION=$version" "/DVERSION_NUMERIC=$numericVersion" "/DSOURCE_EXE=$source" "installer\MelonTools.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Pop-Location
          $setup = "Windows/dist/MelonTools-$version-setup.exe"
          if (-not (Test-Path $setup)) { throw "installer was not produced" }
          Get-Item $setup | Format-List Name,Length

      - name: Sign the installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ runner.temp }}\melontools-cert.pfx
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          try {
            $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
            [IO.File]::WriteAllBytes($env:WINDOWS_CERT_PFX, $bytes)
            $setup = "Windows/dist/MelonTools-${{ steps.version.outputs.version }}-setup.exe"
            ./packaging/sign-windows.ps1 -File $setup -Require
            if ($LASTEXITCODE -ne 0) { throw "sign-windows.ps1 failed for installer" }
          } finally {
            Remove-Item $env:WINDOWS_CERT_PFX -Force -ErrorAction SilentlyContinue
          }

      - name: Generate the SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(Get-ChildItem "Windows/dist/MelonTools-*-win-x64-portable.exe") +
                   @(Get-ChildItem "Windows/dist/MelonTools-*-win-x64.exe") +
                   @(Get-ChildItem "Windows/dist/MelonTools-*-setup.exe")
          if (-not $files) { throw "No Windows artifacts found to hash." }
          foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" |
              Set-Content -Path "$($file.FullName).sha256" -Encoding ascii -NoNewline
            Get-Content "$($file.FullName).sha256"
          }

      - name: Verify Windows artifacts (native)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Hashtable splatting binds named parameters; array splatting passes
          # its items positionally, which sent "6.0.0-rc.1" to a positional
          # parameter and failed the job.
          $checkArgs = @{
            Dist = "Windows/dist"
            Version = "${{ steps.version.outputs.version }}"
            Report = "Windows/dist/windows-acceptance.txt"
          }
          if ("${{ steps.signing.outputs.enabled }}" -eq "true") {
            $checkArgs.RequireSignature = $true
          }
          & ./packaging/verify-windows-artifacts.ps1 @checkArgs

      - name: Upload the executable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-exe
          path: |
            Windows/dist/MelonTools-*-win-x64-portable.exe
            Windows/dist/MelonTools-*-win-x64-portable.exe.sha256
            Windows/dist/MelonTools-*-win-x64.exe
            Windows/dist/MelonTools-*-win-x64.exe.sha256
            Windows/dist/MelonTools-*-setup.exe
            Windows/dist/MelonTools-*-setup.exe.sha256
            Windows/dist/windows-acceptance.txt
          if-no-files-found: error

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate the SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: melontools.cdx.json

      - name: Upload the SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: melontools.cdx.json
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: [macos, windows, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Refuse to overwrite a published release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft' 2>/dev/null || echo missing)"
          if [ "$state" = "false" ]; then
            echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
            echo "Delete the release first or publish a new version." >&2
            exit 1
          fi

      - name: Download the build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Download the SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom
          path: release-assets

      - name: List the release assets
        run: ls -l release-assets

      # The draft must carry metadata generated from the actual CI artifacts.
      # It is attached as a zip; the committed manifests are promoted by a
      # human only after these hashes match the draft downloads.
      - name: Generate staged distribution metadata
        env:
          V: ${{ needs.macos.outputs.version }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/release-metadata"
          rm -rf "$STAGE"
          python3 scripts/verify_release_checksums.py \
            --stage "$V" \
            --artifacts release-assets \
            --out "$STAGE"
          ZIP="$GITHUB_WORKSPACE/release-assets/MelonTools-$V-release-metadata.zip"
          # Fixed arcname ("release-metadata/...") so the promotion workflow can
          # extract and diff it against packaging/staging/<version> exactly.
          python3 - "$STAGE" "$ZIP" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob("*")):
                  if path.is_file():
                      archive.write(path, Path("release-metadata") / path.relative_to(source))
          PY
          (cd release-assets && sha256sum "MelonTools-$V-release-metadata.zip" \
            > "MelonTools-$V-release-metadata.zip.sha256")

      - name: Build one SHA256SUMS file
        working-directory: release-assets
        env:
          V: ${{ needs.macos.outputs.version }}
        run: |
          set -euo pipefail
          # Stable, unversioned aliases for README "latest" links. The
          # versioned files remain the auditable, release-notes targets.
          cp "MelonTools-$V.dmg" MelonTools.dmg
          cp "MelonTools-$V-setup.exe" MelonTools-setup.exe
          cp "MelonTools-$V-win-x64-portable.exe" MelonTools-win-x64-portable.exe
          cp "MelonTools-$V-win-x64.exe" MelonTools-win-x64.exe
          for stable in MelonTools.dmg MelonTools-setup.exe MelonTools-win-x64-portable.exe MelonTools-win-x64.exe; do
            sha256sum -- "$stable" > "$stable.sha256"
          done
          sha256sum -- *.dmg *.exe | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      # Strict build-phase gate: the assets must match the metadata generated
      # from those exact bytes. It intentionally does NOT compare against the
      # committed manifests, which still describe the previously published
      # release; verifying that the promoted manifests match this draft is the
      # separate, blocking job in release-promote.yml.
      - name: Verify artifacts against the staged metadata
        run: |
          set -euo pipefail
          V="${{ needs.macos.outputs.version }}"
          STAGE="$RUNNER_TEMP/release-metadata"
          python3 scripts/verify_release_checksums.py \
            --verify-staged "$STAGE" \
            --artifacts release-assets \
            --sha256sums release-assets/SHA256SUMS \
            --version "$V"
          # The attached zip is the reviewable handoff to promotion: fail if it
          # is not a byte-for-byte copy of the staged directory.
          rm -rf "$RUNNER_TEMP/attached-metadata"
          mkdir -p "$RUNNER_TEMP/attached-metadata"
          python3 -m zipfile -e "release-assets/MelonTools-$V-release-metadata.zip" \
            "$RUNNER_TEMP/attached-metadata"
          diff -r "$STAGE" "$RUNNER_TEMP/attached-metadata/release-metadata"
          (cd release-assets && sha256sum -c "MelonTools-$V-release-metadata.zip.sha256")

      - name: Verify every expected asset
        run: |
          set -euo pipefail
          V="${{ needs.macos.outputs.version }}"
          for name in \
            "MelonTools-$V.dmg" \
            "MelonTools-$V.dmg.sha256" \
            "MelonTools-$V-setup.exe" \
            "MelonTools-$V-setup.exe.sha256" \
            "MelonTools-$V-win-x64-portable.exe" \
            "MelonTools-$V-win-x64-portable.exe.sha256" \
            "MelonTools-$V-win-x64.exe" \
            "MelonTools-$V-win-x64.exe.sha256" \
            "MelonTools-$V-release-metadata.zip" \
            "MelonTools-$V-release-metadata.zip.sha256" \
            "SHA256SUMS"; do
            test -f "release-assets/$name" || { echo "missing $name" >&2; exit 1; }
          done

      - name: Compose the release notes
        run: |
          set -euo pipefail
          V="${{ needs.macos.outputs.version }}"
          {
            echo "## Melon Tools $V"
            echo ""
            echo "Artifacts for macOS (universal DMG) and Windows (installer + portable executable)."
            echo "Verify each download against its \`.sha256\` file before running it."
            echo ""
            if [[ "$V" == *-* ]]; then
              echo "> **Pre-release.** This is a test build. It is published as a GitHub"
              echo "> prerelease, it is not the latest release, and it is **not** offered"
              echo "> through Homebrew or winget, which stay on the last stable version."
              echo ""
            fi
            if [ "${{ needs.macos.outputs.signed }}" != "true" ]; then
              echo "> **macOS build note:** ad-hoc signed and not notarized."
              echo "> Signing and notarization are BLOCKED until the Apple secrets are"
              echo "> configured; see \`packaging/README.md\`. On first launch use"
              echo "> right-click → Open when Gatekeeper blocks the app."
              echo ""
            fi
            if [ "${{ needs.windows.outputs.signed }}" != "true" ]; then
              echo "> **Windows build note:** the executable is not Authenticode-signed,"
              echo "> so Windows Defender SmartScreen may show \"Windows protected your PC\""
              echo "> and refuse the first launch. Choose **More info → Run anyway** only"
              echo "> after the SHA-256 matches the value below. A code-signing certificate"
              echo "> is required to remove this warning; see \`packaging/README.md\`."
              echo ""
            fi
            echo "Full changelog: [MacOS/RELEASE_NOTES.md](https://github.com/vanich-git/MelonTools/blob/${{ env.RELEASE_TAG }}/MacOS/RELEASE_NOTES.md)."
            echo ""
            if [[ "$V" == *-* ]]; then
              echo "### Prerelease"
              echo ""
              echo "The SHA-256 values below were generated from these exact artifacts and"
              echo "are attached as \`MelonTools-$V-release-metadata.zip\`."
              echo "This release stays a GitHub prerelease: it does not become \"latest\""
              echo "and it is not promoted into Homebrew/winget."
            else
              echo "### Draft: promotion pending"
              echo ""
              echo "This is a **draft**. The SHA-256 values below were generated from these"
              echo "exact artifacts and are attached as \`MelonTools-$V-release-metadata.zip\`."
              echo "Publishing requires the \`Release promotion\` workflow, which blocks"
              echo "until the promoted Homebrew/winget manifests match these assets."
            fi
            echo ""
            echo "### SHA-256"
            echo ""
            echo '```'
            cat release-assets/SHA256SUMS
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Create or update the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Melon Tools ${{ needs.macos.outputs.version }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          # A human promotes the draft after checking the assets and hashes.
          # Backfills must never become "latest". A prerelease version stays a
          # GitHub prerelease and is never promoted into Homebrew/winget.
          draft: true
          prerelease: ${{ contains(needs.macos.outputs.version, '-') }}
          make_latest: false
