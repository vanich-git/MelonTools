name: Links

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  links:
    name: Release and documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # 404/410 fail; timeouts, 5xx, 401/403 and 429 are warnings so a
      # transient network or rate limit cannot break the schedule.
      - name: Check HTTP links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_links.py
