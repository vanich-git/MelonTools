name: Links

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  links:
    name: Release and documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # 404/410 fail; timeouts, 5xx, 401/403 and 429 are warnings so a
      # transient network or rate limit cannot break the schedule.
      - name: Check HTTP links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_links.py
