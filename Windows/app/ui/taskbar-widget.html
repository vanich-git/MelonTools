<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Melon Tools — Taskbar</title>
  <link rel="stylesheet" href="taskbar-widget.css">
</head>
<body>
  <button id="widget" type="button" aria-label="Открыть Melon Tools" title="Melon Tools">
    <span class="mark" aria-hidden="true"><img src="logo.png" alt=""></span><i id="api-dot" aria-hidden="true"></i>
    <span class="content"><span class="headline"><b>Melon Tools</b><span id="api-status">…</span></span>
      <span class="metrics"><span><small id="hour-label">5ч</small> <strong id="hour-value">—</strong></span><span class="separator">·</span><span><small id="week-label">7д</small> <strong id="week-value">—</strong></span></span>
    </span>
  </button>
  <script src="mt-bridge.js"></script>
  <script src="taskbar-widget.js"></script>
</body>
</html>
