<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Melon Tools</title>
  <link rel="stylesheet" href="mt.css" />
</head>
<body>
  <div class="app">
    <div class="workspace">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo"><span>🍉</span></div>
          <div class="brand-text">
            <div class="title">Melon Tools</div>
            <div class="sub" id="brand-sub">планировщик и Codex в одном месте</div>
          </div>
        </div>
        <nav id="nav"></nav>
        <div class="sidebar-update">
          <button class="update-btn" id="update-btn" data-action="updateOpen">
            <span id="update-label">Проверить обновление</span>
          </button>
        </div>
        <div class="side-footer">
          <span class="dot" id="gw-dot"></span>
          <span id="gw-label">…</span>
          <span class="spacer"></span>
          <span id="ver"></span>
        </div>
      </aside>
      <main class="detail"><div class="board" id="main"></div></main>
    </div>
  </div>

  <div id="update-modal" class="modal" hidden>
    <div class="modal-card">
      <h2 id="update-title">Проверка обновлений…</h2>
      <div id="update-sub" class="footnote"></div>
      <div id="update-notes" class="notes" style="display:none"></div>
      <div class="row" style="justify-content:flex-end;margin-top:16px">
        <button class="ghost" id="update-cancel" data-action="updateClose">Отмена</button>
        <button class="btn" id="update-apply" style="display:none" data-action="updateApply">Обновить</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <script src="vendor/qrcode.js"></script>
  <script src="mt-bridge.js"></script>
  <script src="mt-state.js"></script>
  <script src="mt-i18n.js"></script>
  <script src="mt-utils.js"></script>
  <script src="mt-api.js"></script>
  <script src="mt-pages.js"></script>
  <script src="mt-actions.js"></script>
  <script src="app.js"></script>
  <script src="mt-redesign.js"></script>
  <script src="mt-redesign-actions.js"></script>
</body>
</html>
